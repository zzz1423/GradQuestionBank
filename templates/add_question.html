{% extends "base.html" %}
{% block title %}录入题目{% endblock %}

{% block content %}
<nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{{ url_for('questions_list') }}">题目列表</a></li>
        <li class="breadcrumb-item active">录入新题目</li>
    </ol>
</nav>

<h4 class="mb-4">录入新题目</h4>

<div class="card">
    <div class="card-body">
        <form method="post">
            <div class="mb-3">
                <label class="form-label">学科 <span class="text-danger">*</span></label>
                <select name="subject_id" class="form-select" required>
                    <option value="">请选择学科</option>
                    {% for s in subjects %}
                    <option value="{{ s.id }}">{{ s.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">题干 <span class="text-danger">*</span></label>
                <textarea name="content" class="form-control" rows="8" required
                          placeholder="粘贴完整题目，选择题请包含选项&#10;&#10;示例：&#10;下列关于唯物辩证法的说法，正确的是（）&#10;A. 矛盾的斗争性是绝对的、有条件的&#10;B. 矛盾的同一性是相对的、无条件的&#10;C. 矛盾的同一性是相对的、有条件的&#10;D. 矛盾的斗争性是相对的、有条件的"></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">答案</label>
                <input type="text" name="answer" class="form-control"
                       placeholder="填写结果即可，如：C 或 42 或简要文字答案">
                <div class="form-text">选择题填选项字母，填空/简答填关键结果</div>
            </div>

            <div class="mb-3">
                <label class="form-label">来源</label>
                <input type="text" name="source" class="form-control"
                       placeholder="如：2024年真题、张宇1000题">
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-circle"></i> 提交并分析知识点
                </button>
                <a href="{{ url_for('questions_list') }}" class="btn btn-outline-secondary">取消</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

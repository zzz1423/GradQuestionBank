{% extends "base.html" %}
{% block title %}编辑题目{% endblock %}

{% block content %}
<nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{{ url_for('question_detail', question_id=question.id) }}">第 {{ question.id }} 题</a></li>
        <li class="breadcrumb-item active">编辑</li>
    </ol>
</nav>

<h4 class="mb-4">编辑题目</h4>

<div class="card">
    <div class="card-body">
        <form method="post">
            <div class="mb-3">
                <label class="form-label">学科 <span class="text-danger">*</span></label>
                <select name="subject_id" class="form-select" required>
                    {% for s in subjects %}
                    <option value="{{ s.id }}" {% if s.id == question.subject_id %}selected{% endif %}>{{ s.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">题干 <span class="text-danger">*</span></label>
                <textarea name="content" class="form-control" rows="8" required>{{ question.content }}</textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">答案</label>
                <input type="text" name="answer" class="form-control" value="{{ question.answer or '' }}">
            </div>

            <div class="mb-3">
                <label class="form-label">来源</label>
                <input type="text" name="source" class="form-control" value="{{ question.source or '' }}">
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-circle"></i> 保存修改
                </button>
                <a href="{{ url_for('question_detail', question_id=question.id) }}" class="btn btn-outline-secondary">取消</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
